{{ define "content" }}
<div class="py-20 px-4 max-w-4xl mx-auto">
    <div class="text-center mb-16">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">Contact Us</h1>
        <p class="text-gray-600">We'd love to hear from you. Whether you want to volunteer or need help, reach out today.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-2xl font-bold mb-6">Send a Message</h2>
            <form action="/contact" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" name="name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="John Doe" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="john@example.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Message</label>
                    <textarea name="message" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="How can we help?" required></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Send Message</button>
            </form>
        </div>

        <div class="space-y-8">
            <div class="flex items-start space-x-4">
                <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xl">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <div>
                    <h3 class="font-bold text-lg">Our Office</h3>
                    <p class="text-gray-600">123 Hope Street, Health District, City Center</p>
                </div>
            </div>
            <div class="flex items-start space-x-4">
                <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-xl">
                    <i class="fas fa-phone"></i>
                </div>
                <div>
                    <h3 class="font-bold text-lg">Call Us</h3>
                    <p class="text-gray-600">+1 (234) 567-8900</p>
                </div>
            </div>
            <div class="flex items-start space-x-4">
                <div class="w-12 h-12 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center text-xl">
                    <i class="fas fa-envelope"></i>
                </div>
                <div>
                    <h3 class="font-bold text-lg">Email Us</h3>
                    <p class="text-gray-600">contact@ngohope.org</p>
                </div>
            </div>
        </div>
    </div>
</div>
{{ end }}
