{{ define "content" }}
<div class="py-20 px-4 max-w-5xl mx-auto">
    <div class="text-center mb-16">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">Our Upcoming Events</h1>
        <p class="text-gray-600 max-w-2xl mx-auto">Join us in our mission to bring health and hope. Check out our scheduled camps and initiatives below.</p>
    </div>

    <div id="events-list" class="space-y-6">
        <!-- Events will be loaded here via JS -->
        <div class="text-center py-10 text-gray-500">Loading events...</div>
    </div>
</div>

<script>
    async function loadAllEvents() {
        try {
            const res = await fetch('/api/events');
            const events = await res.json();
            const container = document.getElementById('events-list');

            if (events.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-gray-500">No upcoming events scheduled. Stay tuned!</div>';
                return;
            }

            container.innerHTML = events.map(e => `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:shadow-md transition">
                    <div class="flex items-start space-x-4">
                        <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center shrink-0">
                            <i class="fas fa-calendar-day"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-gray-800">${e.title}</h3>
                            <p class="text-gray-600 mt-1">${e.description}</p>
                            <div class="flex items-center text-sm text-gray-400 mt-2">
                                <i class="fas fa-map-marker-alt mr-2"></i> ${e.location}
                                <span class="mx-2">•</span>
                                <i class="fas fa-clock mr-2"></i> ${new Date(e.event_date).toLocaleString()}
                            </div>
                        </div>
                    </div>
                    <a href="/contact" class="bg-blue-600 text-white px-6 py-2 rounded-full font-medium hover:bg-blue-700 transition text-center">
                        Join Event
                    </a>
                </div>
            `).join('');
        } catch (err) {
            console.error('Error loading events:', err);
            document.getElementById('events-list').innerHTML = '<div class="text-center py-10 text-red-500">Failed to load events. Please try again later.</div>';
        }
    }

    window.onload = loadAllEvents;
</script>
{{ end }}
